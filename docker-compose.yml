services:
  postgres:
    image: postgres:16.10-alpine
    # 200 connections so the concurrency test and load test can open real parallel connections instead of queueing.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: velio
      POSTGRES_PASSWORD: velio
      POSTGRES_DB: velio
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velio -d velio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.5-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
