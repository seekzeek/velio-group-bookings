name: backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: velio
          POSTGRES_PASSWORD: velio
          POSTGRES_DB: velio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U velio -d velio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4.5-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://velio:velio@localhost:5432/velio
      TEST_DATABASE_URL: postgresql://velio:velio@localhost:5432/velio_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
      CONTACT_HMAC_SECRET: ci-secret-that-is-long-enough
      FLAG_SALT: ci-salt-velio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
